<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1C1C1E; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

    #bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse 800px 1000px at 540px 960px, rgba(31,127,254,0.08) 0%, #1C1C1E 55%);
      z-index: 0; }
    #grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
      background-image: radial-gradient(circle, rgba(31,127,254,0.15) 1px, transparent 1px);
      background-size: 70px 70px; pointer-events: none; }
    #rim-l { position: absolute; top: 0; left: 0; width: 8px; height: 100%; z-index: 2;
      background: linear-gradient(180deg, #1F7FFE 0%, transparent 100%); opacity: 0.4; }

    /* TOP ZONE: 0–640px */
    #top-tag { position: absolute; top: 120px; left: 80px;
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 22px;
      color: #1F7FFE; letter-spacing: 0.16em; text-transform: uppercase; z-index: 6; }
    #top-headline { position: absolute; top: 168px; left: 80px; width: 920px;
      font-family: 'Inter', sans-serif; font-weight: 900; font-size: 100px;
      color: #FFFFFF; line-height: 0.92; letter-spacing: -0.03em; z-index: 6; }
    #top-rule { position: absolute; top: 388px; left: 80px; width: 0; height: 2px;
      background: #1F7FFE; z-index: 6; }
    #top-sub { position: absolute; top: 414px; left: 80px; width: 920px;
      font-family: 'Inter', sans-serif; font-weight: 400; font-size: 30px;
      color: #888; line-height: 1.4; z-index: 6; }
    #top-eq { position: absolute; top: 546px; left: 80px; width: 920px;
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 26px;
      color: #555; letter-spacing: 0.08em; z-index: 6; }

    /* MID ZONE: 640–1280px — logo cards vertical stack */
    .logo-card {
      position: absolute; left: 80px; width: 920px; height: 152px;
      background: #2c2c2e; border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      display: flex; align-items: center; gap: 36px; padding: 0 40px;
      z-index: 5; }
    #card-mj { top: 668px; }
    #card-kl { top: 848px; }
    #card-lu { top: 1028px; }
    .card-logo { width: 80px; height: 80px; object-fit: contain; flex-shrink: 0; }
    .card-info { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .card-name { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 32px;
      color: #fff; letter-spacing: 0.02em; }
    .card-desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 22px;
      color: #888; }
    .card-badge { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 18px;
      color: #1F7FFE; letter-spacing: 0.08em; background: rgba(31,127,254,0.12);
      padding: 6px 14px; border-radius: 6px; white-space: nowrap; }

    /* BOTTOM ZONE: 1280–1920px */
    #btm-accent { position: absolute; top: 1222px; left: 80px; width: 0; height: 3px;
      background: linear-gradient(to right, #1F7FFE, transparent); z-index: 6; }
    #btm-italic { position: absolute; top: 1310px; left: 80px; width: 920px;
      font-family: 'Playfair Display', serif; font-style: italic; font-size: 46px;
      color: #CFFF04; line-height: 1.3; z-index: 6; }
    #btm-sub { position: absolute; top: 1480px; left: 80px; width: 920px;
      font-family: 'Inter', sans-serif; font-weight: 400; font-size: 28px;
      color: #555; line-height: 1.4; z-index: 6; }
    #btm-brand { position: absolute; top: 1768px; left: 80px;
      font-family: 'Inter', sans-serif; font-weight: 800; font-size: 22px;
      color: rgba(255,255,255,0.25); letter-spacing: 0.14em; text-transform: uppercase; z-index: 6; }
    #btm-dot { position: absolute; top: 1762px; right: 80px; width: 36px; height: 36px;
      border: 2px solid #1F7FFE; border-radius: 50%; z-index: 6; }
  </style>
</head>
<body>
  <div id="root"
       data-composition-id="broll-04"
       data-start="0" data-duration="3.664"
       data-width="1080" data-height="1920">

    <!-- Layer 0: Environment -->
    <div id="bg" class="clip" data-start="0" data-duration="3.664" data-track-index="0"></div>
    <div id="grid" class="clip" data-start="0" data-duration="3.664" data-track-index="1"></div>
    <div id="rim-l" class="clip" data-start="0" data-duration="3.664" data-track-index="2"></div>

    <!-- TOP ZONE: primary text -->
    <div id="top-tag" class="clip" data-start="0" data-duration="3.664" data-track-index="3">The Toolkit</div>
    <div id="top-headline" class="clip" data-start="0" data-duration="3.664" data-track-index="4">THE AI<br/>TOOLS.</div>
    <div id="top-rule" class="clip" data-start="0" data-duration="3.664" data-track-index="5"></div>
    <div id="top-sub" class="clip" data-start="0" data-duration="3.664" data-track-index="6">Everyone has the same access.</div>
    <div id="top-eq" class="clip" data-start="0" data-duration="3.664" data-track-index="7">Same tools ≠ Same results</div>

    <!-- MID ZONE: logo cards (vertical stack, portrait-correct) -->
    <div id="card-mj" class="logo-card clip" data-start="0" data-duration="3.664" data-track-index="8">
      <img src="assets/logos/midjourney.svg" class="card-logo" alt="Midjourney" />
      <div class="card-info">
        <div class="card-name">Midjourney</div>
        <div class="card-desc">AI image generation</div>
      </div>
      <div class="card-badge">~$10/mo</div>
    </div>
    <div id="card-kl" class="logo-card clip" data-start="0" data-duration="3.664" data-track-index="9">
      <img src="assets/logos/kling.svg" class="card-logo" alt="Kling" />
      <div class="card-info">
        <div class="card-name">Kling</div>
        <div class="card-desc">AI video generation</div>
      </div>
      <div class="card-badge">~$20/mo</div>
    </div>
    <div id="card-lu" class="logo-card clip" data-start="0" data-duration="3.664" data-track-index="10">
      <img src="assets/logos/luma.svg" class="card-logo" alt="Luma" />
      <div class="card-info">
        <div class="card-name">Luma</div>
        <div class="card-desc">AI video generation</div>
      </div>
      <div class="card-badge">~$30/mo</div>
    </div>

    <!-- BOTTOM ZONE: accent + italic -->
    <div id="btm-accent" class="clip" data-start="0" data-duration="3.664" data-track-index="11"></div>
    <div id="btm-italic" class="clip" data-start="0" data-duration="3.664" data-track-index="12">"your taste is the differentiator"</div>
    <div id="btm-sub" class="clip" data-start="0" data-duration="3.664" data-track-index="13">The tools are even. Your eye is not.</div>
    <div id="btm-brand" class="clip" data-start="0" data-duration="3.664" data-track-index="14">SOLOFLOWS</div>
    <div id="btm-dot" class="clip" data-start="0" data-duration="3.664" data-track-index="15"></div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      gsap.set('#grid', { opacity: 0 });
      gsap.set('#rim-l', { opacity: 0 });
      gsap.set('#top-tag', { opacity: 0, y: -10 });
      gsap.set('#top-headline', { opacity: 0, y: -20 });
      gsap.set('#top-rule', { width: 0 });
      gsap.set('#top-sub', { opacity: 0 });
      gsap.set('#top-eq', { opacity: 0 });
      gsap.set('#card-mj', { opacity: 0, y: 24 });
      gsap.set('#card-kl', { opacity: 0, y: 24 });
      gsap.set('#card-lu', { opacity: 0, y: 24 });
      gsap.set('#btm-accent', { width: 0 });
      gsap.set('#btm-italic', { opacity: 0, y: 12 });
      gsap.set('#btm-sub', { opacity: 0 });
      gsap.set('#btm-brand', { opacity: 0 });
      gsap.set('#btm-dot', { opacity: 0, scale: 0, transformOrigin: 'center center' });

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['broll-04'] = tl;

      // env: 0–0.2s
      tl.to('#grid', { opacity: 1, duration: 0.2, ease: 'power2.out' }, 0);
      tl.to('#rim-l', { opacity: 0.4, duration: 0.3, ease: 'power2.out' }, 0);

      // primary text top: 0.15–0.8s
      tl.to('#top-tag', { opacity: 1, y: 0, duration: 0.28, ease: 'power2.out' }, 0.15);
      tl.to('#top-headline', { opacity: 1, y: 0, duration: 0.38, ease: 'power3.out' }, 0.3);
      tl.to('#top-rule', { width: 920, duration: 0.35, ease: 'power3.out' }, 0.55);
      tl.to('#top-sub', { opacity: 1, duration: 0.28, ease: 'power2.out' }, 0.68);
      tl.to('#top-eq', { opacity: 1, duration: 0.25, ease: 'power2.out' }, 0.82);

      // primary visual — cards stagger: 0.5–1.2s
      tl.to('#card-mj', { opacity: 1, y: 0, duration: 0.38, ease: 'power3.out' }, 0.5);
      tl.to('#card-kl', { opacity: 1, y: 0, duration: 0.38, ease: 'power3.out' }, 0.66);
      tl.to('#card-lu', { opacity: 1, y: 0, duration: 0.38, ease: 'power3.out' }, 0.82);

      // accent/bottom: 1.1–1.9s
      tl.to('#btm-accent', { width: 920, duration: 0.4, ease: 'power3.out' }, 1.1);
      tl.to('#btm-italic', { opacity: 1, y: 0, duration: 0.38, ease: 'power2.out' }, 1.35);
      tl.to('#btm-sub', { opacity: 1, duration: 0.3, ease: 'power2.out' }, 1.6);
      tl.to('#btm-brand', { opacity: 1, duration: 0.25, ease: 'power2.out' }, 1.78);
      tl.to('#btm-dot', { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(1.5)' }, 1.86);

      // fade: 3.164s
      tl.to('#root', { opacity: 0, duration: 0.5, ease: 'power2.inOut' }, 3.164);
    });
  </script>
</body>
</html>
