<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F4F4F4; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

    #background { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
      background: #F4F4F4; }
    #ambient-top { position: absolute; top: 0; left: 0; width: 100%; height: 40%; z-index: 1;
      background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 100%);
      pointer-events: none; }
    #accent-edge { position: absolute; top: 0; left: 0; width: 6px; height: 100%;
      background: linear-gradient(180deg, #1F7FFE 0%, rgba(31,127,254,0.2) 100%);
      z-index: 2; }

    /* TOP ZONE TAG */
    #top-tag { position: absolute; top: 64px; left: 80px;
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 20px;
      color: #1F7FFE; letter-spacing: 0.16em; text-transform: uppercase; z-index: 8; }

    .widget { position: absolute;
      background: #F8F9FB; border-radius: 20px;
      box-shadow: -5px -5px 10px rgba(255,255,255,0.95), 5px 5px 10px rgba(163,177,198,0.55); }

    /* TOP ZONE: 0–640px */
    #widget-greeting { top: 118px; left: 60px; width: 960px; height: 200px; z-index: 3;
      padding: 44px 50px; }
    #widget-stat-left { top: 352px; left: 60px; width: 456px; height: 200px; z-index: 3;
      padding: 36px 40px; display: flex; flex-direction: column; justify-content: center; }
    #widget-stat-right { top: 352px; left: 564px; width: 456px; height: 200px; z-index: 3;
      padding: 36px 40px; display: flex; flex-direction: column; justify-content: center; }

    /* MID ZONE: 640–1280px */
    #widget-chart { top: 592px; left: 60px; width: 960px; height: 480px; z-index: 3;
      padding: 44px 50px; display: flex; flex-direction: column; gap: 22px; }

    .stat-label { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 22px;
      color: #555; text-transform: uppercase; letter-spacing: 1.5px; }
    .stat-number { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 52px;
      color: #1A202C; margin-top: 8px; line-height: 1; }
    #greeting-label { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 22px;
      color: #555; text-transform: uppercase; letter-spacing: 1.5px; }
    #greeting-name { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 46px;
      color: #2D3748; margin-top: 10px; line-height: 1.2; }
    #chart-title { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 24px;
      color: #718096; text-transform: uppercase; letter-spacing: 1px; }
    #chart-bar-track { position: relative; width: 100%; height: 24px; background: #E8EDF2;
      border-radius: 12px;
      box-shadow: inset 2px 2px 5px rgba(163,177,198,0.5), inset -2px -2px 5px rgba(255,255,255,0.8); }
    #chart-bar-fill { position: absolute; top: 0; left: 0; height: 100%; width: 0;
      background: linear-gradient(90deg, #1F7FFE, #4a9fff); border-radius: 12px; }
    #chart-bar-glow { position: absolute; top: -4px; left: 0; height: 32px; width: 0;
      background: rgba(31,127,254,0.15); border-radius: 16px; filter: blur(6px); }
    #chart-label { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 20px;
      color: #555; margin-top: 6px; }
    #chart-kpi { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 28px;
      color: #1F7FFE; margin-top: 12px; }

    /* BOTTOM ZONE: 1280–1920px */
    #badge-rule { position: absolute; top: 1182px; left: 60px; width: 0; height: 3px;
      background: #1C1C1E; z-index: 8; }
    #badge-startup { position: absolute; top: 1218px; left: 60px; width: 960px;
      font-family: 'Inter', sans-serif; font-weight: 800; font-size: 58px;
      color: #1C1C1E; letter-spacing: -0.01em; line-height: 1.1; z-index: 8; }
    #badge-sub { position: absolute; top: 1404px; left: 60px; width: 960px;
      font-family: 'Inter', sans-serif; font-weight: 400; font-size: 30px;
      color: #718096; z-index: 8; }
    #btm-divider { position: absolute; top: 1520px; left: 60px; width: 0; height: 2px;
      background: #1F7FFE; z-index: 8; }
    #btm-note { position: absolute; top: 1552px; left: 60px; width: 960px;
      font-family: 'Inter', sans-serif; font-weight: 400; font-size: 26px;
      color: #aaa; z-index: 8; }
    #btm-brand { position: absolute; top: 1768px; left: 60px;
      font-family: 'Inter', sans-serif; font-weight: 800; font-size: 22px;
      color: #1F7FFE; letter-spacing: 0.14em; text-transform: uppercase; z-index: 8; }
    #btm-stats { position: absolute; top: 1766px; right: 60px;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 22px;
      color: #aaa; letter-spacing: 0.06em; z-index: 8; }
  </style>
</head>
<body>
  <div id="root"
       data-composition-id="broll-07"

  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      gsap.set('#ambient-top', { opacity: 0 });
      gsap.set('#accent-edge', { scaleY: 0, transformOrigin: 'top center' });
      gsap.set('#top-tag', { opacity: 0, y: -10 });
      gsap.set('#widget-greeting', { scale: 0.90, opacity: 0, transformOrigin: 'center center' });
      gsap.set('#widget-stat-left', { scale: 0.90, opacity: 0, transformOrigin: 'center center' });
      gsap.set('#widget-stat-right', { scale: 0.90, opacity: 0, transformOrigin: 'center center' });
      gsap.set('#widget-chart', { y: 30, opacity: 0 });
      gsap.set('#greeting-label', { opacity: 0 });
      gsap.set('#greeting-name', { opacity: 0 });
      gsap.set('#chart-bar-fill', { width: '0%' });
      gsap.set('#chart-bar-glow', { width: '0%' });
      gsap.set('#chart-kpi', { opacity: 0 });
      gsap.set('#badge-rule', { width: 0 });
      gsap.set('#badge-startup', { opacity: 0, y: 22 });
      gsap.set('#badge-sub', { opacity: 0, y: 16 });
      gsap.set('#btm-divider', { width: 0 });
      gsap.set('#btm-note', { opacity: 0 });
      gsap.set('#btm-brand', { opacity: 0 });
      gsap.set('#btm-stats', { opacity: 0 });

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['broll-07'] = tl;

      // env: 0–0.3s
      tl.to('#ambient-top', { opacity: 1, duration: 0.8 }, 0.1);
      tl.to('#accent-edge', { scaleY: 1, duration: 0.5, ease: 'power2.out' }, 0);
      tl.to('#top-tag', { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.15);

      // primary visual — widgets: 0.3–1.4s
      tl.to('#widget-greeting', { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.2)' }, 0.3);
      tl.to('#greeting-label', { opacity: 1, duration: 0.3 }, 0.65);
      tl.to('#greeting-name', { opacity: 1, duration: 0.3 }, 0.8);
      tl.to('#widget-stat-left', { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(1.2)' }, 0.85);
      tl.to('#widget-stat-right', { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(1.2)' }, 0.98);
      tl.to('#widget-chart', { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out' }, 1.3);

      // primary text — chart + bar: 1.3–2.2s

      tl.to('#chart-bar-glow', { width: '68%', duration: 0.9, ease: 'power2.out' }, 1.68);
      tl.to('#chart-kpi', { opacity: 1, duration: 0.3, ease: 'power2.out' }, 2.3);

      // accent/bottom: 1.6–2.8s
      tl.to('#badge-rule', { width: 960, duration: 0.4, ease: 'power3.out' }, 1.6);
      tl.to('#badge-startup', { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 1.82);
      tl.to('#badge-sub', { opacity: 1, y: 0, duration: 0.38, ease: 'power2.out' }, 2.18);
      tl.to('#btm-divider', { width: 960, duration: 0.35, ease: 'power3.out' }, 2.38);
      tl.to('#btm-note', { opacity: 1, duration: 0.3, ease: 'power2.out' }, 2.55);
      tl.to('#btm-brand', { opacity: 1, duration: 0.28, ease: 'power2.out' }, 2.72);
      tl.to('#btm-stats', { opacity: 1, duration: 0.25, ease: 'power2.out' }, 2.8);

      // fade: 3.708s
      tl.to('#root', { opacity: 0, duration: 0.5, ease: 'power2.in' }, 3.708);
    });
  </script>
