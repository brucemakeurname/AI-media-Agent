<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1C1C1E; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

    #bg-dark { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background: #1C1C1E; }
    #grid-texture {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(31,127,254,0.06) 59px, rgba(31,127,254,0.06) 60px),
        repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(31,127,254,0.06) 59px, rgba(31,127,254,0.06) 60px);
      pointer-events: none; }

    /* Title block — bottom right */
    #title-block { position: absolute; bottom: 220px; right: 54px; width: 340px; height: 200px;
      border: 1.5px solid rgba(255,255,255,0.7); z-index: 4; }
    #title-block-text { position: absolute; bottom: 220px; right: 54px; width: 340px; height: 200px;
      z-index: 5; padding: 10px 14px; }
    .tb-label { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 14px;
      color: rgba(255,255,255,0.70); letter-spacing: 0.08em; line-height: 2.0; }
    .tb-value { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
      color: rgba(255,255,255,0.90); }

    /* Main drawing area */
    #drawing-group { position: absolute; top: 12%; left: 5%; width: 62%; height: 60%; z-index: 4; }
    #drawing-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* Dimension lines */
    #dim-lines { position: absolute; top: 12%; left: 5%; width: 62%; height: 60%; z-index: 5;
      font-family: 'Inter', sans-serif; font-size: 18px; color: rgba(255,255,255,0.65); }
    .dim-label { position: absolute; font-size: 18px;
      font-family: 'Inter', sans-serif; color: rgba(31,127,254,0.90); white-space: nowrap; }
    #dim1 { top: 10%; left: 5%; }
    #dim2 { top: 40%; left: 5%; }
    #dim3 { top: 70%; left: 5%; }

    /* Callout circles — pixel positioned */
    #cc1 { position: absolute; top: 538px; left: 378px; width: 50px; height: 50px; z-index: 6; }
    #cc2 { position: absolute; top: 845px; left: 238px; width: 44px; height: 44px; z-index: 6; }
    .callout-circle { width: 100%; height: 100%; border-radius: 50%;
      border: 1.5px solid rgba(31,127,254,0.80); background: transparent; }
    #cl1 { position: absolute; top: 557px; left: 324px; width: 120px; height: 1px;
      background: rgba(31,127,254,0.60); z-index: 6; transform-origin: left center; }
    #cl2 { position: absolute; top: 864px; left: 173px; width: 100px; height: 1px;
      background: rgba(31,127,254,0.60); z-index: 6; transform-origin: left center; }

    /* Inset view */
    #inset-border { position: absolute; top: 192px; right: 43px; width: 28%; height: 26%;
      border: 1px solid rgba(31,127,254,0.60); z-index: 4; }
    #inset-content { position: absolute; top: 230px; right: 54px; width: 25%; height: 22%;
      z-index: 5; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 10px; }
    #inset-content img { width: 120px; }
    #inset-label { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600;
      color: rgba(255,255,255,0.8); text-align: center; letter-spacing: 0.06em; }

    /* BOTTOM ZONE additions */
    #btm-rule { position: absolute; bottom: 190px; left: 54px; width: 0; height: 2px;
      background: linear-gradient(to right, #1F7FFE, transparent); z-index: 6; }
    #btm-italic { position: absolute; bottom: 100px; left: 54px; width: 590px;
      font-family: 'Playfair Display', serif; font-style: italic; font-size: 36px;
      color: #CFFF04; z-index: 6; }
  </style>
</head>
<body>
  <div id="root"
       data-composition-id="broll-06"
       data-start="0" data-duration="4.977"
       data-width="1080" data-height="1920">

    <!-- Layer 0: Environment -->
    <div id="bg-dark" class="clip" data-start="0" data-duration="4.977" data-track-index="0"></div>
    <div id="grid-texture" class="clip" data-start="0" data-duration="4.977" data-track-index="1"></div>

    <!-- Layer 1: Title block — BOTTOM zone -->
    <div id="title-block" class="clip" data-start="0" data-duration="4.977" data-track-index="2"></div>
    <div id="title-block-text" class="clip" data-start="0" data-duration="4.977" data-track-index="3">
      <div class="tb-label">PROJECT: <span class="tb-value">AI INFLUENCER BUDGET</span></div>
      <div class="tb-label">SCALE: <span class="tb-value">MONTHLY SPEND</span></div>
      <div class="tb-label">DATE: <span class="tb-value">2025</span></div>
      <div class="tb-label">DWG NO: <span class="tb-value">GPU-001</span></div>
    </div>

    <!-- Layer 2: Main drawing — spans TOP + MID zones -->
    <div id="drawing-group" class="clip" data-start="0" data-duration="4.977" data-track-index="4">
      <svg id="drawing-svg" viewBox="0 0 580 520" xmlns="http://www.w3.org/2000/svg" style="background:#1C1C1E">
        <rect width="580" height="520" fill="#1C1C1E"/>
        <rect x="80" y="60" width="420" height="300" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.5" stroke-dasharray="1600" stroke-dashoffset="1600"/>
        <rect x="120" y="90" width="120" height="80" fill="none" stroke="rgba(31,127,254,0.70)" stroke-width="1"/>
        <rect x="270" y="90" width="120" height="80" fill="none" stroke="rgba(31,127,254,0.70)" stroke-width="1"/>
        <rect x="120" y="200" width="270" height="100" fill="none" stroke="rgba(31,127,254,0.70)" stroke-width="1"/>
        <line x1="80" y1="210" x2="580" y2="210" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
        <line x1="290" y1="60" x2="290" y2="360" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
        <line x1="80" y1="120" x2="40" y2="120" stroke="rgba(31,127,254,0.60)" stroke-width="1"/>
        <line x1="80" y1="160" x2="40" y2="160" stroke="rgba(31,127,254,0.60)" stroke-width="1"/>
        <line x1="80" y1="200" x2="40" y2="200" stroke="rgba(31,127,254,0.60)" stroke-width="1"/>
        <line x1="80" y1="240" x2="40" y2="240" stroke="rgba(31,127,254,0.60)" stroke-width="1"/>
        <line x1="500" y1="120" x2="540" y2="120" stroke="rgba(31,127,254,0.60)" stroke-width="1"/>
        <line x1="500" y1="160" x2="540" y2="160" stroke="rgba(31,127,254,0.60)" stroke-width="1"/>
        <line x1="500" y1="200" x2="540" y2="200" stroke="rgba(31,127,254,0.60)" stroke-width="1"/>
        <line x1="500" y1="240" x2="540" y2="240" stroke="rgba(31,127,254,0.60)" stroke-width="1"/>
        <text x="290" y="430" text-anchor="middle" fill="rgba(255,255,255,0.80)" font-family="Inter" font-size="18" letter-spacing="4">GPU UNIT — H100 EQUIV.</text>
      </svg>
    </div>

    <!-- Layer 2: Dimension labels — TOP + MID zones -->
    <div id="dim-lines" class="clip" data-start="0" data-duration="4.977" data-track-index="5">
      <div class="dim-label" id="dim1">← $20/mo Kling</div>
      <div class="dim-label" id="dim2">← $10/mo Midjourney</div>
      <div class="dim-label" id="dim3">← $16/mo Runway</div>
    </div>

    <!-- Layer 2: Callout circles — TOP zone -->
    <div id="cc1" class="clip" data-start="0" data-duration="4.977" data-track-index="6"><div class="callout-circle"></div></div>
    <div id="cc2" class="clip" data-start="0" data-duration="4.977" data-track-index="7"><div class="callout-circle"></div></div>
    <div id="cl1" class="clip" data-start="0" data-duration="4.977" data-track-index="8"></div>
    <div id="cl2" class="clip" data-start="0" data-duration="4.977" data-track-index="9"></div>

    <!-- Layer 2: Inset view — TOP zone -->
    <div id="inset-border" class="clip" data-start="0" data-duration="4.977" data-track-index="10"></div>
    <div id="inset-content" class="clip" data-start="0" data-duration="4.977" data-track-index="11">
      <img src="assets/logos/nvidia.svg" alt="NVIDIA" />
      <div id="inset-label">POWERED BY</div>
    </div>

    <!-- Layer 3: Accent — BOTTOM zone -->
    <div id="btm-rule" class="clip" data-start="0" data-duration="4.977" data-track-index="12"></div>
    <div id="btm-italic" class="clip" data-start="0" data-duration="4.977" data-track-index="13">"the real cost of AI creation"</div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      gsap.set('#title-block', { opacity: 0, scaleX: 0, transformOrigin: 'right center' });
      gsap.set('#title-block-text', { opacity: 0 });
      gsap.set('#dim-lines', { opacity: 0 });
      gsap.set('#cc1,#cc2', { scale: 0, opacity: 0, transformOrigin: 'center center' });
      gsap.set('#cl1,#cl2', { scaleX: 0 });
      gsap.set('#inset-border', { opacity: 0, scaleY: 0, transformOrigin: 'top center' });
      gsap.set('#inset-content', { opacity: 0 });
      gsap.set('#btm-rule', { width: 0 });
      gsap.set('#btm-italic', { opacity: 0, y: 10 });

      var svgRects = document.querySelectorAll('#drawing-svg rect');
      svgRects.forEach(function(r) {
        r.style.strokeDasharray = '1600';
        r.style.strokeDashoffset = '1600';
      });

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['broll-06'] = tl;

      // env: 0–0.3s
      tl.to('#grid-texture', { opacity: 1, duration: 0.3 }, 0);

      // primary visual — scene-01: title block + SVG draw (0–2.5s)
      tl.to('#title-block', { opacity: 1, scaleX: 1, duration: 0.3, ease: 'power1.out' }, 0);
      tl.to('#title-block-text', { opacity: 1, duration: 0.25, ease: 'power2.out' }, 0.5);
      tl.to(svgRects, { strokeDashoffset: 0, duration: 1.8, ease: 'power1.out', stagger: 0.2 }, 0.8);
      tl.to('#dim-lines', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 2.3);
      tl.to('#inset-border', { opacity: 1, scaleY: 1, duration: 0.25, ease: 'power2.out' }, 2.0);
      tl.to('#inset-content', { opacity: 1, duration: 0.35, ease: 'power2.out' }, 2.3);

      // primary text — callouts appear
      tl.to('#cc1', { scale: 1, opacity: 1, duration: 0.25, ease: 'back.out(1.5)' }, 2.5);
      tl.to('#cl1', { scaleX: 1, duration: 0.3, ease: 'power1.out' }, 2.5);
      tl.to('#cc2', { scale: 1, opacity: 1, duration: 0.25, ease: 'back.out(1.5)' }, 2.7);
      tl.to('#cl2', { scaleX: 1, duration: 0.3, ease: 'power1.out' }, 2.7);

      // accent: bottom zone
      tl.to('#btm-rule', { width: 590, duration: 0.4, ease: 'power3.out' }, 2.9);
      tl.to('#btm-italic', { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 3.1);

      // fade: 4.477s
      tl.to('#root', { opacity: 0, duration: 0.5, ease: 'power2.in' }, 4.477);
    });
  </script>
</body>
</html>
