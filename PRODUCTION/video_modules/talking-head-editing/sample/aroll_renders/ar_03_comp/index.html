<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent !important; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    #band { position: absolute; bottom: 0; left: 0; width: 1080px; height: 640px; overflow: hidden; }

    #grain {
      position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
      opacity: 0; pointer-events: none; z-index: 10; animation: grain-shift 0.5s steps(1) infinite paused;
    }
    #grain.active { animation-play-state: running; }
    @keyframes grain-shift {
      0%{transform:translate(0,0)} 10%{transform:translate(-5%,-5%)} 20%{transform:translate(-10%,5%)}
      30%{transform:translate(5%,-10%)} 40%{transform:translate(-5%,15%)} 50%{transform:translate(-10%,5%)}
      60%{transform:translate(15%,0%)} 70%{transform:translate(0%,10%)} 80%{transform:translate(-15%,0%)}
      90%{transform:translate(10%,5%)} 100%{transform:translate(5%,0%)}
    }

    #card {
      position: absolute; top: 32px; left: 60px; width: 960px;
      background: rgba(10,14,26,0.88); border: 1px solid rgba(34,211,238,0.18);
      border-left: 3px solid #22d3ee; border-radius: 20px; padding: 26px 48px 26px 44px;
      box-shadow: 0 0 48px rgba(34,211,238,0.07), 0 12px 48px rgba(0,0,0,0.75); z-index: 5; overflow: hidden;
    }
    #edge-glow { position:absolute; top:0; left:0; width:3px; height:100%; background:#22d3ee; box-shadow:0 0 18px 3px rgba(34,211,238,0.7); border-radius:0 0 0 20px; z-index:6; opacity:0; }
    #shimmer { position:absolute; inset:0; background:linear-gradient(120deg,transparent 0%,transparent 30%,rgba(255,255,255,0.40) 50%,transparent 70%,transparent 100%); mix-blend-mode:overlay; pointer-events:none; z-index:15; opacity:0; }

    #rl-header { font-family:'Inter',sans-serif; font-weight:700; font-size:13px; color:rgba(34,211,238,0.55); letter-spacing:0.18em; text-transform:uppercase; margin-bottom:14px; }

    .rl-row { display:flex; align-items:flex-start; gap:20px; }
    .rl-idx { font-family:'Inter',sans-serif; font-weight:900; font-size:44px; color:#22d3ee; line-height:1; text-shadow:0 0 18px rgba(34,211,238,0.4); min-width:54px; flex-shrink:0; }
    .rl-content { flex:1; padding-top:4px; }
    .rl-text { font-family:'Inter',sans-serif; font-weight:800; font-size:27px; color:#ffffff; line-height:1.25; text-shadow:0 2px 14px rgba(0,0,0,0.85); margin-bottom:12px; }
    .rl-bar-wrap { display:flex; align-items:center; gap:12px; }
    .rl-bar-track { flex:1; height:8px; background:rgba(255,255,255,0.07); border-radius:4px; overflow:hidden; }
    .rl-bar-fill { height:100%; border-radius:4px; width:0%; background:linear-gradient(90deg,#22d3ee,#38bdf8); box-shadow:0 0 10px rgba(34,211,238,0.45); }
    .rl-bar-label { font-family:'Inter',sans-serif; font-weight:700; font-size:13px; color:rgba(34,211,238,0.70); min-width:60px; }

    #brand-tag { position:absolute; bottom:20px; right:32px; font-family:'Inter',sans-serif; font-weight:700; font-size:13px; color:rgba(34,211,238,0.22); letter-spacing:0.16em; text-transform:uppercase; z-index:6; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="aroll-03" data-start="0" data-duration="3.061" data-width="1080" data-height="1920">
    <div id="band">
      <div id="grain" class="clip" data-start="0" data-duration="3.061" data-track-index="0"></div>
      <div id="card" class="clip" data-start="0" data-duration="3.061" data-track-index="1" data-layout-allow-overflow>
        <div id="edge-glow"></div>
        <div id="shimmer" data-layout-allow-overflow></div>

        <!-- segs 30–32 rel=0.000 "Number three, your personal taste is the only competitive advantages." -->
        <div id="rl-header">Your Edge</div>
        <div class="rl-row" id="row-03">
          <div class="rl-idx" id="rl-idx">03</div>
          <div class="rl-content">
            <div class="rl-text" id="rl-text">Your personal taste is the only competitive advantage.</div>
            <div class="rl-bar-wrap">
              <div class="rl-bar-track"><div class="rl-bar-fill" id="rl-bar"></div></div>
              <span class="rl-bar-label" id="rl-bar-lbl">Unique</span>
            </div>
          </div>
        </div>
      </div>
      <div id="brand-tag" class="clip" data-start="0" data-duration="3.061" data-track-index="2">SOLOFLOWS</div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      gsap.set('#grain',      { opacity: 0 });
      gsap.set('#card',       { y: 32, opacity: 0 });
      gsap.set('#edge-glow',  { opacity: 0 });
      gsap.set('#rl-header',  { opacity: 0 });
      gsap.set('#rl-idx',     { opacity: 0, scale: 0.8 });
      gsap.set('#rl-text',    { opacity: 0, y: 10 });
      gsap.set('#rl-bar',     { width: '0%' });
      gsap.set('#rl-bar-lbl', { opacity: 0 });
      gsap.set('#shimmer',    { x: '-130%', opacity: 0 });
      gsap.set('#brand-tag',  { opacity: 0 });

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['aroll-03'] = tl;

      tl.to('#grain',      { opacity:0.10, duration:0.28, ease:'power1.out', onStart:function(){ document.getElementById('grain').classList.add('active'); } }, 0);
      tl.to('#card',       { y:0, opacity:1, duration:0.36, ease:'power3.out' }, 0.08);
      tl.to('#edge-glow',  { opacity:1, duration:0.28, ease:'power1.out' }, 0.16);
      tl.to('#brand-tag',  { opacity:1, duration:0.24 }, 0.26);
      tl.to('#rl-header',  { opacity:1, duration:0.20, ease:'power2.out' }, 0.26);
      tl.to('#rl-idx',     { opacity:1, scale:1, duration:0.26, ease:'back.out(1.7)' }, 0.36);
      tl.to('#rl-text',    { opacity:1, y:0, duration:0.26, ease:'power2.out' }, 0.50);
      tl.to('#rl-bar',     { width:'95%', duration:0.55, ease:'power2.inOut' }, 0.62);
      tl.to('#rl-bar-lbl', { opacity:1, duration:0.18 }, 0.64);
      tl.to('#shimmer',    { x:'130%', opacity:1, duration:0.50, ease:'power1.inOut' }, 1.40);

      // Fade at 2.561s (3.061 − 0.500)
      tl.to('#card',      { opacity:0, y:-8, duration:0.42, ease:'power2.in' }, 2.561);
      tl.to('#brand-tag', { opacity:0, duration:0.26 }, 2.561);
      tl.to('#grain', { opacity:0, duration:0.28, onComplete:function(){ document.getElementById('grain').classList.remove('active'); } }, 2.661);
    });
  </script>
</body>
</html>
