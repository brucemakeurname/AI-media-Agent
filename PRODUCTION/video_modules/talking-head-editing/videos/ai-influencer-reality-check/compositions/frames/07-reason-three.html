  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-1.5s): chrome numeral + kicker fade in.
      tl.fromTo(
        ".rt3-chrome",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0,
      );
      tl.fromTo(

        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0.15,
      );

      // Scene 2 (1.5-4.5s): display clause slams in — kinetic-beat-slam,
      // single-phrase scale+blur hard hit (power4.out), then a quiet
      // low-amplitude breathing hold for the rest of the shot.
      tl.set(".rt3-display", { opacity: 1 }, 1.5);
      tl.fromTo(
        ".rt3-display",
        { scale: 1.4, filter: "blur(16px)", opacity: 0 },
        {
          scale: 1,
          filter: "blur(0px)",
          opacity: 1,
          duration: 0.5,
          ease: "power4.out",
        },
        1.5,
      );
      (function () {
        var holdStart = 1.5 + 0.5 + 0.2;
        var cycle = 1.6;
        var frameEnd = 8.32;
        var holdDur = frameEnd - holdStart;
        var repeat = Math.max(0, Math.floor(holdDur / cycle) - 1);
        tl.to(
          ".rt3-display",
          {
            scale: 1.015,
            duration: cycle / 2,
            ease: "sine.inOut",
            yoyo: true,
            repeat: repeat,
          },
          holdStart,
        );
      })();

      // Scene 3 (4.5-7.0s): four tool names reveal left-to-right, one at a
      // time, as an in-place discrete token cycle (discrete-text-sequence):
      // each token jumps instantly from its placeholder dash to its final
      // name at its own threshold — no tween on the text itself.
      tl.fromTo(
        ".rt3-tools",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        4.0,
      );

      var toolStates = [
        { time: 4.5, text: "MIDJOURNEY" },
        { time: 5.2, text: "KLING" },
        { time: 5.9, text: "LUMA" },
        { time: 6.6, text: "NANO BANANA" },
      ];
      var toolEls = gsap.utils.toArray(".rt3-tool");

      var toolDriver = { t: 0 };
      tl.to(
        toolDriver,
        {
          t: 8.32,
          duration: 8.32,
          ease: "none",
          onUpdate: function () {
            for (var i = 0; i < toolStates.length; i++) {
              var el = toolEls[i];
              var revealed = toolDriver.t >= toolStates[i].time;
              el.textContent = revealed ? toolStates[i].text : "—";
              el.style.color = revealed
                ? "rgba(17,17,17,0.75)"
                : "rgba(17,17,17,0.3)";

        },
        0,
