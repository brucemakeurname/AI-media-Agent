  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // --- Scene 1: numeral flash sequence (discrete-text-sequence) ---
      // Reverse-search a sparse state array; jumps are instant (no easing) —
      // top position also steps discretely to read as "top-to-bottom".
      var NUM_SEQ = [
        { t: 0.0, text: "01", top: 22 },
        { t: 0.26, text: "02", top: 27 },
        { t: 0.52, text: "03", top: 32 },
        { t: 0.78, text: "04", top: 37 },
        { t: 1.02, text: "", top: 42 },
      ];
      function numeralAt(time) {
        for (var i = NUM_SEQ.length - 1; i >= 0; i--) {
          if (time >= NUM_SEQ[i].t) return NUM_SEQ[i];
        }
        return NUM_SEQ[0];
      }
      var numeralEl = document.getElementById("f11-numeral");
      var numeralWrapEl = document.querySelector(".f11-numerals-wrap");
      var numDriver = { t: 0 };
      tl.to(
        numDriver,
        {
          t: 1.15,
          duration: 1.15,
          ease: "none",
          onUpdate: function () {
            var state = numeralAt(numDriver.t);
            numeralEl.textContent = state.text;
            numeralWrapEl.style.top = state.top + "cqh";
          },
        },
        0,
      );

      // --- Scene 2: Statement builds via kinetic-beat-slam (2 chunks, one shared beat grid) ---
      // Chunk 1 "stop the": scale+blur slam.
      tl.fromTo(
        "#f11-chunk-1",
        { scale: 1.4, filter: "blur(14px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.4, ease: "power4.out" },
        1.2,
      );

      // Chunk 2 "cheat code": side-snap entrance, distinct from chunk 1's axis.
      tl.fromTo(
        "#f11-chunk-2",
        { x: -60, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" },
        1.55,
      );

      // Finale: settle — one finite low-amplitude breath, never a loop past data-duration.
      tl.fromTo(
        "#f11-statement",
        { scale: 1 },
        { scale: 1.015, duration: 0.209, yoyo: true, repeat: 1, ease: "sine.inOut" },
        1.95,
      );

      window.__timelines["11-takeaway"] = tl;
    })();
