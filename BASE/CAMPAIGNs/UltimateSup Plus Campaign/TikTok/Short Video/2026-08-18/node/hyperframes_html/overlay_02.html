<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .overlay-stage {
    position: relative;
    width: 1080px; height: 1920px;
  }
  .stat-card-wrap {
    position: absolute;
    right: 50px;
    top: 500px;
    width: 460px;
    background: rgba(15, 18, 26, 0.88);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 2px solid rgba(255, 215, 0, 0.6);
    border-radius: 28px;
    padding: 32px 28px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255,255,255,0.2);
    transform: translateY(60px) scale(0.9);
    opacity: 0;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 24px;
    font-weight: 900;
    color: #FFD700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .badge-tag {
    background: rgba(255, 215, 0, 0.15);
    color: #FFD700;
    border: 1px solid rgba(255, 215, 0, 0.5);
    font-size: 14px;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .stat-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    padding: 14px 18px;
    border-left: 4px solid #FFD700;
    transform: translateX(40px);
    opacity: 0;
  }
  .stat-row:last-child {
    margin-bottom: 0;
  }
  .stat-icon {
    font-size: 28px;
  }
  .stat-text {
    display: flex;
    flex-direction: column;
  }
  .stat-val {
    font-size: 26px;
    font-weight: 900;
    color: #FFFFFF;
  }
  .stat-sub {
    font-size: 15px;
    font-weight: 600;
    color: #A0AEC0;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div class="overlay-stage">
  <div class="stat-card-wrap" id="card">
    <div class="card-header">
      <span class="card-title">PVL ISO GOLD</span>
      <span class="badge-tag">100% ISOLATE</span>
    </div>
    <div class="stat-row" id="row1">
      <span class="stat-icon">⚡</span>
      <div class="stat-text">
        <span class="stat-val">27g Pure Protein</span>
        <span class="stat-sub">Ultra-filtered Whey Isolate</span>
      </div>
    </div>
    <div class="stat-row" id="row2">
      <span class="stat-icon">🧬</span>
      <div class="stat-text">
        <span class="stat-val">Added Enzymes</span>
        <span class="stat-sub">Targeted digestive support</span>
      </div>
    </div>
    <div class="stat-row" id="row3">
      <span class="stat-icon">💧</span>
      <div class="stat-text">
        <span class="stat-val">Instant Mixing</span>
        <span class="stat-sub">Zero-clump daily routine</span>
      </div>
    </div>
  </div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  // Card pop-in
  tl.to("#card", {
    y: 0,
    scale: 1,
    opacity: 1,
    duration: 0.8,
    ease: "back.out(1.5)"
  }, 0.0);

  // Stagger row items
  tl.to("#row1", { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.3);
  tl.to("#row2", { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.6);
  tl.to("#row3", { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.9);

  // Gentle hold pulse at 4.0s
  tl.to(".stat-row", {
    scale: 1.03,
    duration: 0.3,
    yoyo: true,
    repeat: 1,
    stagger: 0.1,
    ease: "sine.inOut"
  }, 4.0);

  // Exit at 7.2s
  tl.to("#card", {
    y: -40,
    opacity: 0,
    duration: 0.6,
    ease: "power2.in"
  }, 7.2);

  window.__tl = tl;
</script>
</body>
</html>
